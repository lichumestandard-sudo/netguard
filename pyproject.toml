[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "0.1.0"
description = "A Python-based network security toolkit for host discovery, port scanning, banner grabbing, ARP scanning, and packet sniffing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lichumestandard-sudo" }
]
dependencies = [
    "scapy>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[project.scripts]
netguard = "netguard.cli:main"

[tool.setuptools.packages.find]
include = ["netguard*"]
